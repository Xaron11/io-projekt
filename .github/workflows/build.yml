name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
          problem-matcher: true

      - name: Build and test
        run: mvn -B -ntp verify
