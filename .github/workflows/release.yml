name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check that the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME does not point to a commit on main"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
          problem-matcher: true

      - name: Check that the tag matches the pom.xml version
        run: |
          pom_version=$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "$pom_version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error file=pom.xml::Tag $GITHUB_REF_NAME does not match pom.xml version $pom_version"
            exit 1
          fi

      - name: Build and test
        run: mvn -B -ntp verify javadoc:jar

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mv "target/json-tools-$version-javadoc.jar" "target/json-tools-$version-javadoc.zip"
          gh release create "$GITHUB_REF_NAME" \
            "target/json-tools-$version.jar" \
            "target/json-tools-$version-javadoc.zip" \
            --verify-tag --generate-notes
